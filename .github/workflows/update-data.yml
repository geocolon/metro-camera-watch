# Refresh the regional snapshots in data/ every day so the map starts from recent camera data.
name: Update camera data

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~4 AM in Los Angeles
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Overpass retries can be slow; don't let a stuck server hold the job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build snapshot
        run: python scripts/build_snapshot.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The timestamp always changes; only commit when the cameras themselves did.
          if python scripts/snapshot_unchanged.py; then
            echo "No camera changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update camera data"
          git pull --rebase   # someone may have pushed while the snapshot was building
          git push
          # Pushes made with the workflow token don't trigger a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
